services:
  - type: web
    name: auction-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://auction-frontend.onrender.com
      - key: JWT_SECRET
        sync: false

  - type: web
    name: auction-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: auction-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
